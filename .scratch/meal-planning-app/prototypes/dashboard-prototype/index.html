<style>
:root{--ink:#19172b;--muted:#77758a;--bg:#f4f3f8;--line:#e7e5ee;--violet:#6547df;--lunch:#eeeafd;--dinner:#fff1df;--snack:#e8f6ec}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg);font:14px/1.45 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1740px;margin:auto;padding:24px clamp(16px,2vw,34px) 50px}.topbar,.page-head,.spotlight-head{display:flex;align-items:end;justify-content:space-between;gap:15px}.topbar{align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:#fff;background:var(--violet);font-weight:900}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.nav,.tabs{display:flex;gap:7px;flex-wrap:wrap}.nav button,.outline,.tabs button,.soft-button{min-height:40px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:750}.nav button.active,.tabs button.active{color:#fff;background:var(--ink);border-color:var(--ink)}.surface{display:grid;gap:16px}.card{padding:clamp(18px,1.6vw,28px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 12px 30px #352d5b0d}.eyebrow{margin:0 0 5px;color:var(--violet);font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.display{margin:0;font-size:clamp(34px,4vw,62px);line-height:1;letter-spacing:-.05em}.subtle,.meal p,.master-card p{color:var(--muted)}.dashboard{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(490px,.88fr);gap:18px;align-items:start}.dashboard>.card,.side>.card{min-width:0}.weekly-card{grid-column:1/-1}.meal-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.meal{min-width:0;padding:14px 15px;border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:14px;background:#fff}.meal.dinner{border-left-color:#ef6b55}.meal.snack{border-left-color:#57a96b}.meal h3{margin:0 0 4px;font-size:16px}.meal p{margin:0;font-size:12px;overflow-wrap:anywhere}.meal .meta{margin-top:8px;color:var(--ink);font-size:11px}.side{display:grid;gap:16px;min-width:0}.day-chip{padding:10px;border:1px solid var(--line);border-radius:13px;background:#faf9fd}.week-preview{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day-chip strong,.day-chip span{display:block}.day-chip strong{font-size:13px}.day-chip span{margin-top:6px;color:var(--muted);font-size:10px;line-height:1.3;overflow-wrap:anywhere}.day-chip.today{border-color:var(--violet);background:#f0edff}.planner{display:grid;gap:10px}.planner-head h2,.page-head h2{margin:0;font-size:clamp(31px,4vw,55px);letter-spacing:-.05em}.day-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff;transition:border-color .15s,box-shadow .15s,opacity .15s}.day-label{cursor:grab;touch-action:none;user-select:none}.day-row.dragging{opacity:.55}.day-row.drag-over{border-color:var(--violet);box-shadow:0 0 0 3px #6547df22}.day-label strong{display:block;font-size:18px}.day-label span{color:var(--muted);font-size:12px}.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.lane{min-width:0;padding:9px;border-radius:13px;background:#faf9fd}.lane.lunch{background:var(--lunch)}.lane.dinner{background:var(--dinner)}.lane.snack{background:var(--snack)}.lane-title{display:flex;justify-content:space-between;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.lane-title button{width:36px;height:36px;border:0;border-radius:9px;background:#fff;color:var(--violet);font-size:20px}.planner .meal{padding:9px;border:0}.planner .meal h3{font-size:13px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.actions button,.ingredient-row button{min-width:40px;min-height:36px;padding:6px 9px;border:1px solid #d9d4f4;border-radius:9px;background:#fff;color:#382794;font-size:11px;font-weight:750}.actions button:hover,.ingredient-row button:hover,.outline:hover,.soft-button:hover{background:#f3f0ff}.actions .delete,.remove{color:#a53d31!important;background:#fff0ed!important;border-color:#f5c8c2!important}.master-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.master-card{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff}.master-card h3{margin:0 0 5px}.master-card p{margin:4px 0;font-size:12px}.ingredient-row{display:grid;grid-template-columns:1.2fr 1.4fr 100px repeat(5,75px) 70px;gap:7px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:11px}.modal-backdrop{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:16px;background:#19172b55}.modal{width:min(720px,100%);max-height:94vh;overflow:auto;padding:22px;border-radius:20px;background:#fff}.modal h2{margin:0 0 15px}.field{display:grid;gap:5px;margin:8px 0}.field label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.field input,.field select,.ingredient input,.ingredient select{width:100%;min-height:40px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}:focus-visible{outline:3px solid #8f7bed;outline-offset:2px}.master-picker{display:grid;gap:5px;margin:8px 0 12px}.master-picker label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.master-picker select{width:100%;min-height:40px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.ingredients{display:grid;gap:7px;margin-top:13px}.ingredient{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 42px;gap:7px;align-items:end}.ingredient-picker{display:grid;gap:3px}.ingredient-picker input{min-height:32px;padding:4px 7px;font-size:11px}.ingredient-picker select{min-height:40px}.unit{align-self:center;color:var(--muted);font-size:11px}.remove{width:40px;height:40px;border:1px solid #f5c8c2;border-radius:9px;font-size:20px}.totals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:15px}.total{padding:8px;border-radius:9px;background:#faf9fd}.total small,.total strong{display:block}.total small{color:var(--muted);font-size:10px}.total strong{font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.modal-actions button,.add-ingredient{min-height:40px;padding:9px 12px;border:0;border-radius:9px;font-weight:750}.cancel{background:#efeff4}.save{color:#fff;background:var(--violet)}.add-ingredient{margin-top:9px;color:#382794;background:var(--lunch)}.swap-tools{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-top:12px}.swap-tools label{display:grid;gap:4px;color:var(--muted);font-size:11px;font-weight:750}.swap-tools select{min-width:140px;min-height:40px;padding:8px;border:1px solid var(--line);border-radius:9px;background:white}.toast{position:fixed;z-index:8;top:15px;left:50%;padding:9px 14px;color:#fff;background:var(--ink);border-radius:999px;transform:translate(-50%,-70px);opacity:0;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.mobile-swap{margin:0 0 4px}.food-info{display:block;margin-top:5px;color:var(--muted);font-size:11px}.basis-note{color:var(--muted);font-size:12px}
@media(max-width:1100px){.dashboard{grid-template-columns:1fr}.side{grid-template-columns:1fr}.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}.ingredient-row{grid-template-columns:1fr 1fr 80px 1fr 1fr 1fr 1fr 1fr 60px}.week-preview{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:700px){.app{padding:14px 12px 32px}.topbar,.page-head,.spotlight-head{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1;padding:8px 6px;font-size:12px}.dashboard,.side{grid-template-columns:1fr}.meal-list{grid-template-columns:1fr}.week-preview{grid-template-columns:repeat(2,minmax(0,1fr))}.day-row{grid-template-columns:1fr;padding:11px}.day-label{display:flex;align-items:baseline;gap:8px}.lanes{grid-template-columns:1fr;gap:7px}.lane{display:grid;grid-template-columns:1fr;gap:5px;padding:9px}.lane-title{font-size:11px}.planner .meal{padding:8px}.master-grid{grid-template-columns:1fr}.ingredient-row{grid-template-columns:1fr 1fr;gap:6px}.ingredient{grid-template-columns:minmax(0,1fr) 65px 88px 40px;gap:4px}.ingredient-picker input{font-size:10px}.totals{grid-template-columns:repeat(3,1fr)}.modal{padding:17px}.swap-tools{align-items:stretch}.swap-tools label{flex:1;min-width:120px}.swap-tools select{width:100%;min-width:0}.swap-tools button{width:100%}}
.daily-progress{grid-column:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:3px}.macro-person{min-width:0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#faf9fd}.macro-person h3{margin:0 0 7px;font-size:13px}.macro-row{display:grid;grid-template-columns:52px minmax(35px,1fr) auto;align-items:center;gap:7px;margin:5px 0;font-size:10px}.macro-track{height:7px;overflow:hidden;border-radius:99px;background:#e7e5ee}.macro-fill{height:100%;border-radius:99px;background:var(--violet)}.macro-fill.met{background:#57a96b}.macro-row strong{white-space:nowrap;font-size:10px}.macro-person small{display:block;margin-top:5px;color:var(--muted);font-size:10px}.ingredient-suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:5px}.ingredient-suggestions button{min-height:38px;padding:7px 9px;text-align:left;border:1px solid #d9d4f4;border-radius:9px;background:#faf9ff;color:var(--ink);font-size:11px}.ingredient-suggestions button strong,.ingredient-suggestions button span{display:block}.ingredient-suggestions button span{color:var(--muted);font-size:10px}.day-row.drop-target{border-style:dashed}.day-label[aria-grabbed="true"]{cursor:grabbing}.day-row .daily-progress{grid-column:2}.day-row.dragging .daily-progress{opacity:.5}.day-row.drag-over .day-label{color:var(--violet)}.carbohydrate{margin-top:16px;padding:13px;border:1px solid #ead7ba;border-radius:13px;background:#fffaf2}.carbohydrate h3{margin:0 0 4px;font-size:15px}.carbohydrate>p{margin:0 0 10px;color:var(--muted);font-size:11px}.carb-amounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.carb-summary{margin-top:6px!important;padding-top:6px;border-top:1px solid var(--line);color:var(--ink)!important}
@media(max-width:700px){.daily-progress{grid-template-columns:1fr}.day-row .daily-progress{grid-column:1}.ingredient-suggestions{grid-template-columns:1fr 1fr}.carb-amounts{grid-template-columns:1fr}}
</style>

<body><main class="app"><header class="topbar"><div class="brand"><div class="logo">P</div><div><h1>Piring Kita</h1><p>Simple meal planning for the week</p></div></div><nav class="nav"><button data-page="dashboard">Dashboard</button><button data-page="planner">Plan the week</button><button data-page="menus">Menus</button><button data-page="ingredients">Ingredients</button></nav></header><div id="app" class="surface"></div></main><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const dates=[['2026-10-05','Mon','5 Oct'],['2026-10-06','Tue','6 Oct'],['2026-10-07','Wed','7 Oct'],['2026-10-08','Thu','8 Oct'],['2026-10-09','Fri','9 Oct'],['2026-10-10','Sat','10 Oct'],['2026-10-11','Sun','11 Oct']],nextDates=[['2026-10-12','Mon','12 Oct'],['2026-10-13','Tue','13 Oct'],['2026-10-14','Wed','14 Oct'],['2026-10-15','Thu','15 Oct'],['2026-10-16','Fri','16 Oct'],['2026-10-17','Sat','17 Oct'],['2026-10-18','Sun','18 Oct']];
// Nutrition is per 100 g for g items and per one unit for every other unit. Gram equivalents are display-only.
const catalog={rice:['Jasmine rice','beras, rice','g',130,2.7,.3,28,.4],chicken:['Chicken breast','ayam, chicken','g',165,31,3.6,0,0],beef:['Beef','daging sapi, sapi, beef','g',250,26,15,0,0],tofu:['Firm tofu','tahu, tofu','g',144,15,8,3,2],broccoli:['Broccoli','brokoli, broccoli','g',34,2.8,.4,7,2.6],egg:['Egg','telur, egg','piece',78,6.3,5.3,.6,0],avocado:['Avocado','alpukat, avocado','g',160,2,15,9,7],banana:['Banana','pisang, banana','piece',105,1.3,.4,27,3.1],peanut:['Peanut butter','selai kacang, peanut butter','g',588,25,50,20,6]};
const meal=(name,ingredients,carbohydrate=null)=>({name,ingredients,carbohydrate}),meals={'2026-10-05|lunch|richard':meal('Ginger chicken rice',['chicken:150','rice:180','broccoli:100']),'2026-10-05|lunch|michelle':meal('Tofu greens bowl',['tofu:160','rice:120','broccoli:120']),'2026-10-05|dinner|shared':meal('Miso salmon tray',['broccoli:160','avocado:50'],{id:'rice',richard:100,michelle:60}),'2026-10-06|lunch|richard':meal('Chicken soba bowl',['chicken:140','broccoli:100','egg:1']),'2026-10-06|lunch|michelle':meal('Tofu rice bowl',['tofu:150','rice:130','avocado:40']),'2026-10-06|dinner|shared':meal('Coconut tofu curry',['tofu:180','broccoli:100'],{id:'rice',richard:100,michelle:60}),'2026-10-07|lunch|richard':meal('Lemongrass chicken',['chicken:160','rice:170','broccoli:100']),'2026-10-07|lunch|michelle':meal('Egg avocado toast',['egg:2','avocado:70','broccoli:80']),'2026-10-07|dinner|shared':meal('Tomato tofu pasta',['tofu:180','broccoli:120'],{id:'rice',richard:90,michelle:60}),'2026-10-08|lunch|richard':meal('Sesame chicken bowl',['chicken:150','rice:170','broccoli:100']),'2026-10-08|lunch|michelle':meal('Green tofu bowl',['tofu:160','rice:120','avocado:50']),'2026-10-08|dinner|shared':meal('Egg fried rice',['egg:2','broccoli:100'],{id:'rice',richard:110,michelle:70}),'2026-10-07|snack|richard':meal('Banana peanut bite',['banana:1','peanut:15']),'2026-10-09|lunch|richard':meal('Chicken avocado salad',['chicken:150','avocado:70','broccoli:160']),'2026-10-09|lunch|michelle':meal('Tofu rice salad',['tofu:160','rice:120','broccoli:150']),'2026-10-09|dinner|shared':meal('Roasted chicken tray',['chicken:180','broccoli:160'],{id:'rice',richard:100,michelle:60}),'2026-10-12|dinner|shared':meal('Ginger tofu stir fry',['tofu:180','broccoli:150'],{id:'rice',richard:100,michelle:60})};
const masterMenus=[{id:'chicken-bowl',name:'Everyday chicken bowl',ingredients:['chicken:150','rice:170','broccoli:100']},{id:'tofu-bowl',name:'Green tofu bowl',ingredients:['tofu:160','rice:120','avocado:50']}],targets={richard:{cal:2400,protein:150,carbs:270,fat:80,fiber:30},michelle:{cal:1900,protein:115,carbs:214,fat:63,fiber:25}},state={page:'dashboard',week:'this',sunday:false,edit:null,masterEdit:null};let draggedDay=null,dragPoint=null,autoScroll=null,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=(d,s,o)=>`${d}|${s}|${o}`,list=()=>state.week==='this'?dates:nextDates;
function itemData(id){return catalog[id]||catalog.rice}function qtyDisplay(id,q){const x=itemData(id),eq=x[8];return `${q} ${x[2]}${x[2]!=='g'&&eq?` (${Number(q)*eq} g)`:''}`}
function totals(rows){return rows.reduce((a,r)=>{const [id,q0]=r.split(':'),x=itemData(id),q=Number(q0)||0,f=x[2]==='g'?q/100:q;a.cal+=x[3]*f;a.protein+=x[4]*f;a.fat+=x[5]*f;a.carbs+=x[6]*f;a.fiber+=x[7]*f;return a},{cal:0,protein:0,carbs:0,fat:0,fiber:0})}function nutritionText(t){return `${Math.round(t.cal)} kcal · P ${t.protein.toFixed(1)}g · C ${t.carbs.toFixed(1)}g · F ${t.fat.toFixed(1)}g · Fiber ${t.fiber.toFixed(1)}g`}function info(m){return nutritionText(totals(m.ingredients))}function ingredients(m){return m.ingredients.map(r=>{const [id,q]=r.split(':');return `${itemData(id)[0]} ${qtyDisplay(id,q)}`}).join(' · ')}
function dinnerRows(m,member){const rows=m.ingredients.map(r=>{const [id,q]=r.split(':');return `${id}:${Number(q)*.5}`});if(m.carbohydrate)rows.push(`${m.carbohydrate.id}:${m.carbohydrate[member]||0}`);return rows}
function carbohydrateText(m){if(!m.carbohydrate)return '';const c=m.carbohydrate;return `${itemData(c.id)[0]} · Richard ${qtyDisplay(c.id,c.richard)} · Michelle ${qtyDisplay(c.id,c.michelle)}`}
function dailyTotals(date,member,override=null){const rows=[];for(const slot of ['lunch','dinner','snack']){const owner=slot==='dinner'?'shared':member,k=key(date,slot,owner),m=override?.key===k?{ingredients:override.ingredients,carbohydrate:override.carbohydrate}:meals[k];if(m)rows.push(...(slot==='dinner'?dinnerRows(m,member):m.ingredients))}return totals(rows)}
function macroProgressMarkup(date,member,override=null){const t=dailyTotals(date,member,override),goal=targets[member],person=member==='richard'?'Richard':'Michelle',weekend=['2026-10-10','2026-10-11','2026-10-17','2026-10-18'].includes(date),nutrients=[['kcal','cal',0],['Protein','protein',1],['Carbs','carbs',1],['Fat','fat',1],['Fiber','fiber',1]],rows=nutrients.map(([label,k,d])=>`<div class="macro-row"><span>${label}</span>${weekend?'<span></span>':`<div class="macro-track"><div class="macro-fill ${t[k]>=goal[k]?'met':''}" style="width:${Math.min(100,t[k]/goal[k]*100)}%"></div></div>`}<strong>${weekend?(d?t[k].toFixed(1):Math.round(t[k])):(d?t[k].toFixed(1):Math.round(t[k]))+' / '+goal[k]}${weekend?'':k==='cal'?'':'g'}</strong></div>`).join('');return `<div class="macro-person"><h3>${person} · ${weekend?'weekend self-managed':'daily target'}</h3>${rows}${weekend?'<small>Planned intake is shown; weekend targets are self-managed.</small>':''}</div>`}
function card(k,editable=true,label=''){const m=meals[k];if(!m)return '<div class="empty">No menu yet</div>';const slot=k.split('|')[1],body=slot==='dinner'?`<p><strong>Shared:</strong> ${esc(ingredients(m))}</p>${m.carbohydrate?`<p class="carb-summary"><strong>Carbohydrate</strong><br>${esc(carbohydrateText(m))}</p>`:''}<p class="meta">Richard · ${nutritionText(totals(dinnerRows(m,'richard')))}<br>Michelle · ${nutritionText(totals(dinnerRows(m,'michelle')))}</p>`:`<p>${esc(ingredients(m))}</p><p class="meta">${info(m)}</p>`;return `<article class="meal ${slot}">${label?`<p class="eyebrow">${label}</p>`:''}<h3>${esc(m.name)}</h3>${body}${editable?`<div class="actions"><button data-edit="${k}">Edit</button><button data-move="${k}">Move</button><button class="delete" data-delete="${k}">Delete</button></div>`:''}</article>`}
function dashboard(){const ds=state.sunday?nextDates:dates,d=ds[state.sunday?0:3],tomorrow=ds[Math.min(ds.indexOf(d)+1,6)],day=x=>card(key(x[0],'lunch','richard'),false,'Richard lunch')+card(key(x[0],'lunch','michelle'),false,'Michelle lunch')+card(key(x[0],'dinner','shared'),false,'Shared dinner')+(meals[key(x[0],'snack','richard')]?card(key(x[0],'snack','richard'),false,'Richard snack'):'')+(meals[key(x[0],'snack','michelle')]?card(key(x[0],'snack','michelle'),false,'Michelle snack'):'');const preview=x=>`<div class="day-chip ${x[0]===d[0]?'today':''}"><strong>${x[1]} ${x[2]}</strong><span>R lunch · ${esc(meals[key(x[0],'lunch','richard')]?.name||'Unplanned')}</span><span>M lunch · ${esc(meals[key(x[0],'lunch','michelle')]?.name||'Unplanned')}</span><span>Dinner · ${esc(meals[key(x[0],'dinner','shared')]?.name||'Unplanned')}</span>${meals[key(x[0],'snack','richard')]?`<span>R snack · ${esc(meals[key(x[0],'snack','richard')].name)}</span>`:''}${meals[key(x[0],'snack','michelle')]?`<span>M snack · ${esc(meals[key(x[0],'snack','michelle')].name)}</span>`:''}</div>`;return `<section class="dashboard"><article class="card"><div class="spotlight-head"><div><p class="eyebrow">${state.sunday?'Next week':'Today'} · ${d[1]}, ${d[2]}</p><h2 class="display">${state.sunday?'Next week':'Today'}</h2></div><button class="outline" data-sunday>${state.sunday?'Show this week':'Simulate Sunday'}</button></div><div class="meal-list">${day(d)}</div><p class="subtle" id="refresh">Auto refreshes every 60 seconds · last refreshed just now</p></article><aside class="side"><article class="card"><p class="eyebrow">Tomorrow · ${tomorrow[1]}, ${tomorrow[2]}</p><h2>${tomorrow[1]} menu</h2><div class="meal-list">${day(tomorrow)}</div></article></aside><article class="card weekly-card"><p class="eyebrow">${state.sunday?'Next week':'This week'}</p><h2>Weekly menu</h2><div class="week-preview">${ds.map(preview).join('')}</div></article></section>`}
function lane(d,s,o,label){const k=key(d[0],s,o);return `<div class="lane ${s}" data-slot="${k}"><div class="lane-title"><span>${label}</span><button aria-label="Add ${label}" data-add="${k}">+</button></div>${card(k)}</div>`}
function planner(){const days=list();return `<section class="card page-head"><div><p class="eyebrow">Weekly planner</p><h2>Plan the week</h2><p class="subtle">Drag a day label onto another day to swap every planned lunch, dinner, and snack.</p></div><div class="tabs"><button class="${state.week==='this'?'active':''}" data-week="this">This week</button><button class="${state.week==='next'?'active':''}" data-week="next">Next week</button></div></section><section class="planner">${days.map(d=>`<article class="day-row" data-day="${d[0]}"><div class="day-label" data-day-handle aria-label="Drag ${d[1]} ${d[2]} to swap the whole day"><strong>${d[1]}</strong><span>${d[2]} · drag to swap</span></div><div class="lanes">${lane(d,'lunch','richard','Richard lunch')}${lane(d,'lunch','michelle','Michelle lunch')}${lane(d,'dinner','shared','Shared dinner')}${lane(d,'snack','richard','Richard snack')}${lane(d,'snack','michelle','Michelle snack')}</div><div class="daily-progress">${macroProgressMarkup(d[0],'richard')}${macroProgressMarkup(d[0],'michelle')}</div></article>`).join('')}</section>`}
function render(){document.querySelector('#app').innerHTML=state.page==='dashboard'?dashboard():state.page==='planner'?planner():state.page==='menus'?menusPage():ingredientsPage();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(!state.edit&&!state.masterEdit)document.querySelector('#modalRoot').innerHTML='';wire()}
function findIngredients(search=''){const q=search.trim().toLowerCase();return Object.entries(catalog).filter(([k,x])=>`${k} ${x[0]} ${x[1]}`.toLowerCase().includes(q))}
function ingredientRows(rows){return rows.map((r,i)=>{const [id,q]=r.split(':'),x=itemData(id);return `<div class="ingredient"><div class="ingredient-picker"><span class="chosen-ingredient" data-chosen="${i}">${esc(x[0])} · ${esc(x[2])}</span><input data-isearch="${i}" autocomplete="off" placeholder="Search name or alias…" aria-label="Search ingredients for row ${i+1}"><input type="hidden" data-mi="${i}" value="${esc(id)}"><div class="ingredient-suggestions" data-suggestions="${i}" aria-live="polite"></div></div><input data-mq="${i}" type="number" min="0" step="any" value="${q}" aria-label="Quantity"><span class="unit">${esc(qtyDisplay(id,q))}</span><button type="button" class="remove" aria-label="Remove ingredient" data-mr="${i}">×</button></div>`}).join('')}
function wireIngredientRows(root,refresh){root.querySelectorAll('[data-isearch]').forEach(input=>input.oninput=()=>{const row=input.closest('.ingredient'),results=row.querySelector('[data-suggestions]'),matches=findIngredients(input.value);results.innerHTML=input.value.trim()?matches.slice(0,6).map(([id,x])=>`<button type="button" data-pick="${id}"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></button>`).join('')||'<small>No matching ingredient or alias.</small>':'';results.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const hidden=row.querySelector('[data-mi]'),id=b.dataset.pick,q=row.querySelector('[data-mq]').value;hidden.value=id;row.querySelector('[data-chosen]').textContent=`${itemData(id)[0]} · ${itemData(id)[2]}`;row.querySelector('.unit').textContent=qtyDisplay(id,q);input.value='';results.innerHTML='';refresh()})});root.querySelectorAll('[data-mq]').forEach(input=>input.oninput=()=>{const row=input.closest('.ingredient'),id=row.querySelector('[data-mi]').value;row.querySelector('.unit').textContent=qtyDisplay(id,input.value||0);refresh()})}
function carbohydrateEditorMarkup(e){if(e.slot!=='dinner')return '';const c=e.carbohydrate,x=itemData(c.id);return `<section class="carbohydrate"><h3>Carbohydrate</h3><p>Choose one carbohydrate and set each person's prepared amount.</p><div class="ingredient-picker"><span class="chosen-ingredient" data-carb-chosen>${esc(x[0])} · ${esc(x[2])}</span><input data-carb-search autocomplete="off" placeholder="Search carbohydrate by name or alias…" aria-label="Search carbohydrate by name or alias"><input type="hidden" data-carb-id value="${esc(c.id)}"><div class="ingredient-suggestions" data-carb-suggestions aria-live="polite"></div></div><div class="carb-amounts"><div class="field"><label>Richard amount (${esc(x[2])})</label><input data-carb-member="richard" type="number" min="0" step="any" value="${c.richard}"></div><div class="field"><label>Michelle amount (${esc(x[2])})</label><input data-carb-member="michelle" type="number" min="0" step="any" value="${c.michelle}"></div></div></section>`}
function wireCarbohydrate(root,refresh){const input=root.querySelector('[data-carb-search]');if(!input)return;input.oninput=()=>{const results=root.querySelector('[data-carb-suggestions]'),matches=findIngredients(input.value);results.innerHTML=input.value.trim()?matches.slice(0,6).map(([id,x])=>`<button type="button" data-carb-pick="${id}"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></button>`).join('')||'<small>No matching ingredient or alias.</small>':'';results.querySelectorAll('[data-carb-pick]').forEach(b=>b.onclick=()=>{root.querySelector('[data-carb-id]').value=b.dataset.carbPick;root.querySelector('[data-carb-chosen]').textContent=`${itemData(b.dataset.carbPick)[0]} · ${itemData(b.dataset.carbPick)[2]}`;input.value='';results.innerHTML='';refresh()})}}
function editorDailyMarkup(e){if(['2026-10-10','2026-10-11','2026-10-17','2026-10-18'].includes(e.date))return '';const members=e.slot==='dinner'?['richard','michelle']:[e.owner];return `<div class="daily-progress">${members.map(m=>macroProgressMarkup(e.date,m,{key:e.key,ingredients:e.ingredients,carbohydrate:e.carbohydrate})).join('')}</div>`}
function mealTotalsMarkup(t){return `<div class="totals">${[['Calories',t.cal,'kcal'],['Protein',t.protein,'g'],['Carbs',t.carbs,'g'],['Fat',t.fat,'g'],['Fiber',t.fiber,'g']].map(x=>`<div class="total"><small>${x[0]}</small><strong>${x[0]==='Calories'?Math.round(x[1]):x[1].toFixed(1)} ${x[2]}</strong></div>`).join('')}</div>`}

function openEditor(k){const [date,slot,owner]=k.split('|'),m=meals[k]||(slot==='dinner'?meal('', ['broccoli:100'],{id:'rice',richard:100,michelle:70}):meal('', ['rice:100']));state.edit={key:k,date,slot,owner,name:m.name,ingredients:[...m.ingredients],carbohydrate:m.carbohydrate?{...m.carbohydrate}:null};renderMealEditor()}
function renderMealEditor(){const e=state.edit;document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop open"><form class="modal" id="mealForm"><h2>${meals[e.key]?'Edit menu':'Add menu'}</h2><div class="master-picker"><label for="masterCopy">Copy master menu</label><select id="masterCopy"><option value="">Choose a saved menu…</option>${masterMenus.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Menu name</label><input id="mealName" value="${esc(e.name)}" required></div><div class="ingredients">${ingredientRows(e.ingredients)}</div><button type="button" class="add-ingredient" data-ma>+ Shared ingredient</button>${carbohydrateEditorMarkup(e)}<div id="mealTotals">${editorMealTotalsMarkup(e)}</div><div id="editorDaily">${editorDailyMarkup(e)}</div><div class="modal-actions"><button type="button" class="cancel" data-close>Cancel</button><button class="save">Save menu</button></div></form></div>`;const f=document.querySelector('#mealForm'),sync=()=>{state.edit.name=document.querySelector('#mealName').value;state.edit.ingredients=[...f.querySelectorAll('[data-mi]')].map((s,i)=>`${s.value}:${Math.max(0,Number(f.querySelector('[data-mq="'+i+'"]').value)||0)}`);if(state.edit.slot==='dinner')state.edit.carbohydrate={id:f.querySelector('[data-carb-id]').value,richard:Math.max(0,Number(f.querySelector('[data-carb-member="richard"]').value)||0),michelle:Math.max(0,Number(f.querySelector('[data-carb-member="michelle"]').value)||0)}} ,refresh=()=>{sync();document.querySelector('#mealTotals').innerHTML=editorMealTotalsMarkup(state.edit);document.querySelector('#editorDaily').innerHTML=editorDailyMarkup(state.edit)};wireIngredientRows(f,refresh);wireCarbohydrate(f,refresh);f.oninput=refresh;document.querySelector('#masterCopy').onchange=()=>{const m=masterMenus.find(x=>x.id===document.querySelector('#masterCopy').value);if(m){state.edit.name=m.name;state.edit.ingredients=[...m.ingredients];if(state.edit.slot==='dinner'){const i=state.edit.ingredients.findIndex(r=>r.startsWith('rice:')),q=i<0?100:Number(state.edit.ingredients.splice(i,1)[0].split(':')[1]);state.edit.carbohydrate={id:'rice',richard:q/2,michelle:q/2}}renderMealEditor()}};f.onsubmit=event=>{event.preventDefault();sync();const n=state.edit.name.trim();if(!n||!state.edit.ingredients.length)return toast('Add a name and shared ingredient');const next=key(state.edit.date,state.edit.slot,state.edit.slot==='dinner'?'shared':state.edit.owner);if(next!==state.edit.key&&meals[next]&&!confirm('Replace the existing menu in this slot?'))return;delete meals[state.edit.key];meals[next]={name:n,ingredients:[...state.edit.ingredients],carbohydrate:state.edit.carbohydrate?{...state.edit.carbohydrate}:null};state.edit=null;render()};document.querySelector('[data-close]').onclick=()=>{state.edit=null;render()};document.querySelector('[data-ma]').onclick=()=>{sync();state.edit.ingredients.push('broccoli:100');renderMealEditor()};f.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{sync();state.edit.ingredients.splice(Number(b.dataset.mr),1);renderMealEditor()})}
function menusPage(){return `<section class="card page-head"><div><p class="eyebrow">Reusable library</p><h2>Menus</h2><p class="subtle">Master menus copy into scheduled meals.</p></div><button class="outline" data-new-master>+ New menu</button></section><section class="master-grid">${masterMenus.map(m=>`<article class="master-card"><h3>${esc(m.name)}</h3><p>${esc(ingredients(m))}</p><p>${info(m)}</p><div class="actions"><button data-edit-master="${m.id}">Edit</button></div></article>`).join('')}</section>`}
function ingredientsPage(){return `<section class="card page-head"><div><p class="eyebrow">Master catalog</p><h2>Ingredients</h2><p class="subtle">Nutrition is per 100 g for gram items, or per one custom unit. Equivalent grams are for preparation display.</p></div><button class="outline" data-new-ingredient>+ New ingredient</button></section><section class="surface">${Object.entries(catalog).map(([id,x])=>`<article class="ingredient-row"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span><span>${esc(x[2])}${x[8]?` · ${x[8]} g each`:''}</span><span>${x[3]} kcal</span><span>P ${x[4]}g</span><span>C ${x[6]}g</span><span>F ${x[5]}g</span><span>Fiber ${x[7]}g</span><button data-edit-ingredient="${id}">Edit</button></article>`).join('')}</section>`}
function openMaster(id){const old=state.masterEdit&&state.masterEdit.id===id?state.masterEdit:masterMenus.find(m=>m.id===id)||{id:'',name:'',ingredients:['rice:100']};state.masterEdit={id:old.id,name:old.name,ingredients:[...old.ingredients]};const draw=()=>{const t=totals(state.masterEdit.ingredients);document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop open"><form class="modal" id="masterForm"><h2>${id?'Edit master menu':'New master menu'}</h2><div class="field"><label>Menu name</label><input id="masterName" value="${esc(state.masterEdit.name)}" required></div><div class="ingredients">${ingredientRows(state.masterEdit.ingredients)}</div><button type="button" class="add-ingredient" data-ma>+ Ingredient</button><div id="masterTotals">${mealTotalsMarkup(t)}</div><div class="modal-actions"><button type="button" class="cancel" data-close>Cancel</button><button class="save">Save menu</button></div></form></div>`;const f=document.querySelector('#masterForm'),sync=()=>{state.masterEdit.name=document.querySelector('#masterName').value;state.masterEdit.ingredients=[...f.querySelectorAll('[data-mi]')].map((s,i)=>`${s.value}:${Math.max(0,Number(f.querySelector('[data-mq="'+i+'"]').value)||0)}`)},refresh=()=>{sync();document.querySelector('#masterTotals').innerHTML=mealTotalsMarkup(totals(state.masterEdit.ingredients))};wireIngredientRows(f,refresh);f.oninput=refresh;f.onsubmit=e=>{e.preventDefault();sync();if(!state.masterEdit.name.trim()||!state.masterEdit.ingredients.length)return toast('Add a name and ingredient');const out={id:state.masterEdit.id||`master-${Date.now()}`,name:state.masterEdit.name.trim(),ingredients:[...state.masterEdit.ingredients]},i=masterMenus.findIndex(m=>m.id===out.id);if(i<0)masterMenus.push(out);else masterMenus[i]=out;state.masterEdit=null;render()};document.querySelector('[data-close]').onclick=()=>{state.masterEdit=null;render()};document.querySelector('[data-ma]').onclick=()=>{sync();state.masterEdit.ingredients.push('rice:100');draw()};f.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{sync();state.masterEdit.ingredients.splice(Number(b.dataset.mr),1);draw()})};draw()}
function openIngredient(id){const x=catalog[id]||['','','g',0,0,0,0,''];document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop open"><form class="modal" id="ingredientForm"><h2>${id?'Edit ingredient':'New ingredient'}</h2><div class="field"><label>Canonical name</label><input id="in" value="${esc(x[0])}" required></div><div class="field"><label>Aliases (comma-separated)</label><input id="ia" value="${esc(x[1])}"></div><div class="field"><label>Unit (g or your own unit)</label><input id="iu" value="${esc(x[2])}" placeholder="e.g. pack, slice, bowl" required></div><div class="field" id="gramsField" ${x[2]==='g'?'hidden':''}><label>Equivalent grams per unit (optional)</label><input id="ig" type="number" min="0.001" step="any" value="${x[8]||''}"></div><p class="basis-note" id="basisNote"></p>${[['c','Calories',x[3]],['p','Protein',x[4]],['f','Fat',x[5]],['b','Carbs',x[6]],['fi','Fiber',x[7]]].map(a=>`<div class="field"><label>${a[1]}</label><input id="i${a[0]}" type="number" min="0" step="any" value="${a[2]}"></div>`).join('')}<div class="modal-actions"><button type="button" class="cancel" data-close>Cancel</button><button class="save">Save ingredient</button></div></form></div>`;const unit=document.querySelector('#iu'),gramField=document.querySelector('#gramsField'),basis=document.querySelector('#basisNote'),update=()=>{const g=unit.value.trim().toLowerCase()==='g';gramField.hidden=g;basis.textContent=g?'Nutrition values are per 100 g.':'Nutrition values are per one '+(unit.value.trim()||'custom unit')+'. Equivalent grams only change the displayed prep quantity.'};unit.oninput=update;update();document.querySelector('#ingredientForm').onsubmit=e=>{e.preventDefault();const n=document.querySelector('#in').value.trim(),rawUnit=unit.value.trim(),u=rawUnit.toLowerCase()==='g'?'g':rawUnit,eq=document.querySelector('#ig').value,nums=['c','p','f','b','fi'].map(k=>Number(document.querySelector('#i'+k).value));if(!n||!u||nums.some(v=>!Number.isFinite(v)||v<0)||eq&&(!Number.isFinite(Number(eq))||Number(eq)<=0))return toast('Check name, unit, equivalent grams, and non-negative nutrition');const newId=id||n.toLowerCase().replace(/[^a-z0-9]+/g,'-');catalog[newId]=[n,document.querySelector('#ia').value.trim(),u,...nums,u.toLowerCase()==='g'?null:(eq?Number(eq):null)];render()};document.querySelector('[data-close]').onclick=render}
function move(a,b){const [,s,o]=a.split('|'),[,t,p]=b.split('|');if(s!==t||o!==p)return toast('Use the same meal slot and person');const x=meals[b];meals[b]=meals[a];if(x)meals[a]=x;else delete meals[a];render()}
function swapDays(a,b){if(a===b)return toast('Choose two different days');const slots=['lunch|richard','lunch|michelle','dinner|shared','snack|richard','snack|michelle'];slots.forEach(s=>{const [slot,owner]=s.split('|'),ka=key(a,slot,owner),kb=key(b,slot,owner),temp=meals[ka];if(meals[kb])meals[ka]=meals[kb];else delete meals[ka];if(temp)meals[kb]=temp;else delete meals[kb]});render()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{state.week=b.dataset.week;render()});document.querySelectorAll('[data-sunday]').forEach(b=>b.onclick=()=>{state.sunday=!state.sunday;render()});document.querySelectorAll('[data-add],[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.add||b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this menu?')){delete meals[b.dataset.delete];render()}});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const d=prompt('Target date (YYYY-MM-DD)');if(d)move(b.dataset.move,key(d,b.dataset.move.split('|')[1],b.dataset.move.split('|')[2]))});document.querySelectorAll('[data-new-master]').forEach(b=>b.onclick=()=>openMaster(''));document.querySelectorAll('[data-edit-master]').forEach(b=>b.onclick=()=>openMaster(b.dataset.editMaster));document.querySelectorAll('[data-new-ingredient]').forEach(b=>b.onclick=()=>openIngredient(''));document.querySelectorAll('[data-edit-ingredient]').forEach(b=>b.onclick=()=>openIngredient(b.dataset.editIngredient));const rows=[...document.querySelectorAll('.day-row')],clean=()=>rows.forEach(x=>x.classList.remove('dragging','drag-over','drop-target')),dayAt=(x,y)=>rows.find(r=>r.dataset.day!==draggedDay&&(()=>{const b=r.getBoundingClientRect();return y>=b.top&&y<=b.bottom&&x>=b.left&&x<=b.right})());document.querySelectorAll('[data-day-handle]').forEach(handle=>{const row=handle.closest('[data-day]');handle.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;draggedDay=row.dataset.day;dragPoint={x:e.clientX,y:e.clientY};autoScroll=setInterval(()=>{if(!dragPoint)return;if(dragPoint.y<64)window.scrollBy(0,-18);else if(dragPoint.y>innerHeight-64)window.scrollBy(0,18);const over=dayAt(dragPoint.x,dragPoint.y);rows.forEach(r=>r.classList.toggle('drag-over',r===over));rows.forEach(r=>r.classList.toggle('drop-target',r===over))},16);row.classList.add('dragging');handle.setAttribute('aria-grabbed','true');e.preventDefault()};handle.onpointermove=e=>{if(!draggedDay)return;rows.forEach(r=>r.classList.remove('drag-over','drop-target'));const over=dayAt(e.clientX,e.clientY);if(over)over.classList.add('drag-over','drop-target')};handle.onpointercancel=()=>{draggedDay=null;dragPoint=null;clearInterval(autoScroll);handle.removeAttribute('aria-grabbed');clean()}});document.onpointermove=e=>{if(!draggedDay)return;dragPoint={x:e.clientX,y:e.clientY};rows.forEach(r=>r.classList.remove('drag-over','drop-target'));const over=dayAt(e.clientX,e.clientY);if(over)over.classList.add('drag-over','drop-target')};document.onpointerup=e=>{if(!draggedDay)return;const from=draggedDay,over=dayAt(e.clientX,e.clientY);draggedDay=null;dragPoint=null;clearInterval(autoScroll);document.querySelectorAll('[data-day-handle]').forEach(h=>h.removeAttribute('aria-grabbed'));clean();if(over)swapDays(from,over.dataset.day)};document.onpointercancel=()=>{draggedDay=null;dragPoint=null;clearInterval(autoScroll);document.querySelectorAll('[data-day-handle]').forEach(h=>h.removeAttribute('aria-grabbed'));clean()}}
function toast(m){const e=document.querySelector('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
function selfCheck(){if(!findIngredients('sa').some(([,x])=>x[0]==='Beef')||!findIngredients('be').some(([,x])=>x[0]==='Beef')||!findIngredients('ayam').some(([,x])=>x[0]==='Chicken breast'))return false;const pack=['Noodles','instant noodle','pack',350,8,12,55,2,75];catalog.testpack=pack;const packTotal=totals(['testpack:1']).cal;delete catalog.testpack;if(packTotal!==350)return false;const master=['rice:100'],scheduled=[...master];scheduled[0]='rice:30';if(master[0]!=='rice:100')return false;const dinner=meal('Test dinner',['broccoli:100'],{id:'rice',richard:100,michelle:60}),richardCarbs=totals(dinnerRows(dinner,'richard')).carbs,michelleCarbs=totals(dinnerRows(dinner,'michelle')).carbs;if(richardCarbs<=michelleCarbs)return false;const before={...meals};meals['2026-10-05|snack|richard']=meal('Test snack',['egg:1']);swapDays('2026-10-05','2026-10-07');const ok=meals['2026-10-07|snack|richard']?.name==='Test snack'&&meals['2026-10-05|dinner|shared']?.name==='Tomato tofu pasta';Object.keys(meals).forEach(k=>delete meals[k]);Object.assign(meals,before);return ok}
console.assert(selfCheck(),'substring search, custom unit totals, separate dinner carbohydrates, independent copy, and full-day swap');render();setInterval(()=>{const e=document.querySelector('#refresh');if(e)e.textContent=`Auto refreshes every 60 seconds · last refreshed ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`},60000);
