<body><main class="app"><header class="topbar"><div class="brand"><div class="logo">P</div><div><h1>Piring Kita</h1><p>Simple meal planning for the week</p></div></div><nav class="nav"><button data-page="dashboard">Dashboard</button><button data-page="planner">Plan the week</button><button data-page="menus">Menus</button><button data-page="ingredients">Ingredients</button><button data-page="settings">Targets</button></nav></header><div id="app" class="surface"></div></main><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const dates=[['2026-10-05','Mon','5 Oct'],['2026-10-06','Tue','6 Oct'],['2026-10-07','Wed','7 Oct'],['2026-10-08','Thu','8 Oct'],['2026-10-09','Fri','9 Oct'],['2026-10-10','Sat','10 Oct'],['2026-10-11','Sun','11 Oct']],nextDates=[['2026-10-12','Mon','12 Oct'],['2026-10-13','Tue','13 Oct'],['2026-10-14','Wed','14 Oct'],['2026-10-15','Thu','15 Oct'],['2026-10-16','Fri','16 Oct'],['2026-10-17','Sat','17 Oct'],['2026-10-18','Sun','18 Oct']];
// Nutrition is per 100 g for g items and per one unit for every other unit. Gram equivalents are display-only.
const catalog={rice:['Jasmine rice','beras, rice','g',130,2.7,.3,28,.4],chicken:['Chicken breast','ayam, chicken','g',165,31,3.6,0,0],beef:['Beef','daging sapi, sapi, beef','g',250,26,15,0,0],tofu:['Firm tofu','tahu, tofu','g',144,15,8,3,2],broccoli:['Broccoli','brokoli, broccoli','g',34,2.8,.4,7,2.6],egg:['Egg','telur, egg','piece',78,6.3,5.3,.6,0],avocado:['Avocado','alpukat, avocado','g',160,2,15,9,7],banana:['Banana','pisang, banana','piece',105,1.3,.4,27,3.1],peanut:['Peanut butter','selai kacang, peanut butter','g',588,25,50,20,6]};
const meal=(name,ingredients,carbohydrate=null,remarks='')=>({name,ingredients,carbohydrate,remarks}),meals={'2026-10-05|lunch|richard':meal('Ginger chicken rice',['chicken:150','rice:180','broccoli:100']),'2026-10-05|lunch|michelle':meal('Tofu greens bowl',['tofu:160','rice:120','broccoli:120']),'2026-10-05|dinner|shared':meal('Miso salmon tray',['broccoli:160','avocado:50'],{id:'rice',richard:100,michelle:60}),'2026-10-06|lunch|richard':meal('Chicken soba bowl',['chicken:140','broccoli:100','egg:1']),'2026-10-06|lunch|michelle':meal('Tofu rice bowl',['tofu:150','rice:130','avocado:40']),'2026-10-06|dinner|shared':meal('Coconut tofu curry',['tofu:180','broccoli:100'],{id:'rice',richard:100,michelle:60}),'2026-10-07|lunch|richard':meal('Lemongrass chicken',['chicken:160','rice:170','broccoli:100']),'2026-10-07|lunch|michelle':meal('Egg avocado toast',['egg:2','avocado:70','broccoli:80']),'2026-10-07|dinner|shared':meal('Tomato tofu pasta',['tofu:180','broccoli:120'],{id:'rice',richard:90,michelle:60}),'2026-10-08|lunch|richard':meal('Sesame chicken bowl',['chicken:150','rice:170','broccoli:100']),'2026-10-08|lunch|michelle':meal('Green tofu bowl',['tofu:160','rice:120','avocado:50']),'2026-10-08|dinner|shared':meal('Egg fried rice',['egg:2','broccoli:100'],{id:'rice',richard:110,michelle:70}),'2026-10-07|snack|richard':meal('Banana peanut bite',['banana:1','peanut:15']),'2026-10-09|lunch|richard':meal('Chicken avocado salad',['chicken:150','avocado:70','broccoli:160']),'2026-10-09|lunch|michelle':meal('Tofu rice salad',['tofu:160','rice:120','broccoli:150']),'2026-10-09|dinner|shared':meal('Roasted chicken tray',['chicken:180','broccoli:160'],{id:'rice',richard:100,michelle:60}),'2026-10-12|dinner|shared':meal('Ginger tofu stir fry',['tofu:180','broccoli:150'],{id:'rice',richard:100,michelle:60})};
const masterMenus=[{id:'chicken-bowl',name:'Everyday chicken bowl',ingredients:['chicken:150','rice:170','broccoli:100']},{id:'tofu-bowl',name:'Green tofu bowl',ingredients:['tofu:160','rice:120','avocado:50']}],profiles={richard:{name:'Richard',birthday:'1987-03-12',sex:'male',height:174,activity:'1.6',weight:78,history:[['2026-09-28',78]]},michelle:{name:'Michelle',birthday:'1990-07-22',sex:'female',height:163,activity:'1.4',weight:62,history:[['2026-09-28',62]]}},targets={richard:{deficit:20,reserve:4300,protein:25,carbs:45,fat:30,fiber:30},michelle:{deficit:20,reserve:3400,protein:25,carbs:45,fat:30,fiber:25}},state={page:'dashboard',week:'this',sunday:false,edit:null,masterEdit:null,review:null};let draggedDay=null,dragPoint=null,autoScroll=null,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=(d,s,o)=>`${d}|${s}|${o}`,list=()=>state.week==='this'?dates:nextDates;
function itemData(id){return catalog[id]||catalog.rice}function qtyDisplay(id,q){const x=itemData(id),eq=x[8];return `${q} ${x[2]}${x[2]!=='g'&&eq?` (${Number(q)*eq} g)`:''}`}
function totals(rows){return rows.reduce((a,r)=>{const [id,q0]=r.split(':'),x=itemData(id),q=Number(q0)||0,f=x[2]==='g'?q/100:q;a.cal+=x[3]*f;a.protein+=x[4]*f;a.fat+=x[5]*f;a.carbs+=x[6]*f;a.fiber+=x[7]*f;return a},{cal:0,protein:0,carbs:0,fat:0,fiber:0})}function nutritionText(t){return `${Math.round(t.cal)} kcal · P ${t.protein.toFixed(1)}g · C ${t.carbs.toFixed(1)}g · F ${t.fat.toFixed(1)}g · Fiber ${t.fiber.toFixed(1)}g`}function info(m){return nutritionText(totals(m.ingredients))}function ingredients(m){return m.ingredients.map(r=>{const [id,q]=r.split(':');return `${itemData(id)[0]} ${qtyDisplay(id,q)}`}).join(' · ')}
function dinnerRows(m,member){const rows=m.ingredients.map(r=>{const [id,q]=r.split(':');return `${id}:${Number(q)*.5}`});if(m.carbohydrate)rows.push(`${m.carbohydrate.id}:${m.carbohydrate[member]||0}`);return rows}
function carbohydrateText(m){if(!m.carbohydrate)return '';const c=m.carbohydrate;return `${itemData(c.id)[0]} · Richard ${qtyDisplay(c.id,c.richard)} · Michelle ${qtyDisplay(c.id,c.michelle)}`}
function dailyTotals(date,member,override=null){const rows=[];for(const slot of ['lunch','dinner','snack']){const owner=slot==='dinner'?'shared':member,k=key(date,slot,owner),m=override?.key===k?{ingredients:override.ingredients,carbohydrate:override.carbohydrate}:meals[k];if(m)rows.push(...(slot==='dinner'?dinnerRows(m,member):m.ingredients))}return totals(rows)}
function macroProgressMarkup(date,member,override=null){const t=dailyTotals(date,member,override),goal=targetCalc(member),person=member==='richard'?'Richard':'Michelle',weekend=['2026-10-10','2026-10-11','2026-10-17','2026-10-18'].includes(date),nutrients=[['kcal','cal',0],['Protein','protein',1],['Carbs','carbs',1],['Fat','fat',1],['Fiber','fiber',1]],rows=nutrients.map(([label,k,d])=>`<div class="macro-row"><span>${label}</span>${weekend?'<span></span>':`<div class="macro-track"><div class="macro-fill ${t[k]>=goal[k]?'met':''}" style="width:${Math.min(100,t[k]/goal[k]*100)}%"></div></div>`}<strong>${weekend?(d?t[k].toFixed(1):Math.round(t[k])):`${d?t[k].toFixed(1):Math.round(t[k])} / ${d?Number(goal[k]).toFixed(1):Math.round(goal[k])}`}${weekend?'':k==='cal'?'':'g'}</strong></div>`).join('');return `<div class="macro-person"><h3>${person} · ${weekend?'weekend self-managed':'daily target'}</h3>${rows}${weekend?'<small>Planned intake is shown; weekend targets are self-managed.</small>':''}</div>`}
function card(k,editable=true,label=''){const m=meals[k];if(!m)return '<div class="empty">No menu yet</div>';const slot=k.split('|')[1],body=slot==='dinner'?`<p><strong>Shared:</strong> ${esc(ingredients(m))}</p>${m.carbohydrate?`<p class="carb-summary"><strong>Carbohydrate</strong><br>${esc(carbohydrateText(m))}</p>`:''}<p class="meta">Richard · ${nutritionText(totals(dinnerRows(m,'richard')))}<br>Michelle · ${nutritionText(totals(dinnerRows(m,'michelle')))}</p>`:`<p>${esc(ingredients(m))}</p><p class="meta">${info(m)}</p>`;return `<article class="meal ${slot}">${label?`<p class="eyebrow">${label}</p>`:''}<h3>${esc(m.name)}</h3>${m.remarks?`<p class="menu-remarks">${esc(m.remarks)}</p>`:''}${body}${editable?`<div class="actions"><button data-edit="${k}">Edit</button><button data-move="${k}">Move</button><button class="delete" data-delete="${k}">Delete</button></div>`:''}</article>`}

function ageOn(birthday,date='2026-10-12'){const b=new Date(`${birthday}T00:00:00`),d=new Date(`${date}T00:00:00`);return d.getFullYear()-b.getFullYear()-((d.getMonth()<b.getMonth()||d.getMonth()===b.getMonth()&&d.getDate()<b.getDate())?1:0)}

function targetCalc(id,weight=null,date=null,overrides={}){const p=profiles[id],current=targets[id],weekDate=date||(state.week==='next'?'2026-10-12':'2026-10-05'),next=weekDate==='2026-10-12',t=next?{...current,...(p.nextTargets||{}),...overrides}:{...current,...overrides},w=weight??(next?(t.weight??current.weight??p.weight):p.weight),age=ageOn(p.birthday,weekDate),estimatable=age>=19&&(p.sex==='male'||p.sex==='female'),ree=estimatable?10*w+6.25*Number(p.height)-5*age+(p.sex==='male'?5:-161):null,maintenance=estimatable?ree*Number(p.activity):null,manual=t.manualCal||2000,weekly=estimatable?maintenance*(1-t.deficit/100)*7:manual*7,weekday=estimatable?(weekly-t.reserve)/5:manual,cal=Math.round(weekday);return {weight:w,age,estimatable,ree,maintenance,weekly,weekday,cal,deficit:t.deficit,protein:cal*t.protein/100/4,carbs:cal*t.carbs/100/4,fat:cal*t.fat/100/9,fiber:t.fiber,referenceFiber:fiberAI(p,weekDate),proteinPct:t.protein,carbsPct:t.carbs,fatPct:t.fat}}

'}${t.protein<10||t.protein>35?'<p class="warning">Protein is outside the adult AMDR (10–35%).</p>':''}${t.fat<20||t.fat>35?'<p class="warning">Fat is outside the adult AMDR (20–35%).</p>':''}${c.weekday<800?'<p class="warning">Below 800 kcal: NICE reserves very-low-energy diets for clinically assessed needs within specialist care.</p>':c.weekday<1200?'<p class="warning">800–1,200 kcal is a low-energy range reserved by NICE for selected people in a supported specialist strategy.</p>':''}${c.weekday<1200?'<p class="warning">High priority: weekday target is below 1,200 kcal. Acknowledge before applying.</p>':''}${c.deficit>30||c.maintenance-c.weekly/7>750?'<p class="warning">Caution: next-week deficit is above 30% or 750 kcal/day.</p>':''}<h4>Weight check-ins</h4><div class="field"><label>New weight for next Monday</label><input data-checkin="${id}" type="number" min="30" max="300" step=".1" placeholder="${p.weight} kg"></div><button class="outline" data-review="${id}">Preview next-week target review</button><ul class="history">${p.history.map(([date,w])=>`<li>${date}: ${w} kg</li>`).join('')}</ul></section>`}).join('');return `<section class="card page-head"><div><p class="eyebrow">Member profiles and planning targets</p><h2>Targets</h2><p class="subtle">Adult planning estimates only. Profile and target edits apply immediately in this in-memory prototype; weight-review choices are staged for next week.</p></div></section><div class="warning">General planning estimates, not medical advice. Needs vary. Not designed for pregnancy, breastfeeding, people under 19, or medically supervised low-energy diets. Discuss medical conditions, medicines, eating-disorder concerns, or very low intake with a qualified health professional.</div><section class="profile-grid">${cards}</section><section class="card"><h3>Guidance and sources</h3><p>Starting profile: 20% deficit and 25% protein / 45% carbohydrate / 30% fat are app defaults, not clinical prescriptions. Adult AMDRs: carbohydra function wireSettings(){document.querySelectorAll('[data-profile]').forEach(x=>x.onchange=()=>{if(x.dataset.key==='activity'&&x.value==='custom')return;profiles[x.dataset.profile][x.dataset.key]=x.value;render()});document.querySelectorAll('[data-target]').forEach(x=>x.onchange=()=>{targets[x.dataset.target][x.dataset.key]=Number(x.value);render()});document.querySelectorAll('[data-activity-custom]').forEach(x=>x.onchange=()=>{const id=x.dataset.activityCustom,v=Number(x.value),s=document.querySelector(`[data-profile="${id}"][data-key="activity"]`);if(v>=1&&v<=2.5){profiles[id].activity=String(v);if(s)s.value='custom';render()}else toast('Use an activity factor from 1.00 to 2.50')});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const id=b.dataset.review,w=Number(document.querySelector(`[data-checkin="${id}"]`).value),t=targets[id],p=profiles[id];if(!w||w<30||w>300)return toast('Enter a valid weight in kg');const macroValid=t.protein+t.carbs+t.fat===100&&t.protein>=10&&t.protein<=35&&t.carbs>=45&&t.carbs<=65&&t.fat>=20&&t.fat<=35,deficitNeedsReset=t.deficit<15||t.deficit>30;state.review={id,oldWeight:p.weight,weight:w,recorded:p.history.some(([d])=>d==='2026-10-12'),proposedDeficit:deficitNeedsReset?20:t.deficit,deficitReason:deficitNeedsReset?'Rule-based app suggestion: return to the 20% starting point because the current setting is outside the prototype 15–30% suggestion band; this band is not a universal safe or best range.':'Rule-based suggestion: keep the current deficit.',proposedMacros:macroValid?{protein:t.protein,carbs:t.carbs,fat:t.fat}:{protein:25,carbs:45,fat:30},macroReason:macroValid?'Current percentages total 100% and are within adult AMDRs, so keep them.':'Rule-based app suggestion: use the in-range 25/45/30 starting profile because the current split is invalid or outside an AMDR.',proposedFiber:fiberAI(p,'2026-10-12')??t.fiber,choices:{calories:false,macros:false,fiber:false}};render()});document.querySelectorAll('[data-proposa
